<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact SRIMATHY R through email, phone or the accessible contact form.">

    <meta name="author" content="SRIMATHY R">

    <title>Contact | SRIMATHY R</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Contact Me</h1>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section>

        <h2>Get In Touch</h2>

        <p>
            I would be happy to connect with you.
        </p>

        <address>

            <p>
                <strong>Name:</strong> SRIMATHY R
            </p>

            <p>
                <strong>Phone:</strong>
                <a href="tel:+911234567890">1234567890</a>
            </p>

            <p>
                <strong>Email:</strong>
                <a href="mailto:srimathyrm@gmail.com">
                    srimathyrm@gmail.com
                </a>
            </p>

        </address>

    </section>

    <section>

        <h2>Send Me a Message</h2>

        <form action="#" method="post">

            <p>
                <label for="name">Name:</label>
                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </p>

            <p>
                <label for="email">Email:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="message">Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>
            </p>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 SRIMATHY R. All rights reserved.</p>
</footer>

</body>
</html>
